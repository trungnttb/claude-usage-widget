[package]
name = "claude-usage-widget"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[lib]
name = "claude_usage_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-notification = "2.4.0"
tauri-plugin-autostart = "2.5.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
# Not "s": size optimization costs 6.5x on the transcript scan (1386ms vs
# 213ms over ~100 MB), and that scan runs at every startup and every refresh.
opt-level = 3
lto = true
strip = true
